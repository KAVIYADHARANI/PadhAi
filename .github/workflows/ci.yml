name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-brand-lint:
    name: Security & Brand Isolation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          cd backend
          uv pip install --system -e ".[dev]"

      - name: Check for committed secrets or private keys
        run: |
          echo "Scanning git index for sensitive files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(\.env(\..+)?$|\.pem$|\.key$|firebase-admin.*\.json$|.*service-account.*\.json$)' | grep -v '\.env\.example' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Found prohibited sensitive file(s) tracked in git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No forbidden secret files detected."

      - name: Run Brand Isolation Lint Test
        run: |
          pytest -v backend/tests/test_brand_lint.py

  backend:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: security-and-brand-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for Firebase Auth Emulator
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install backend dependencies
        run: |
          cd backend
          uv pip install --system -e ".[dev]"

      - name: Lint backend code with Ruff
        run: |
          ruff check backend

      - name: Run Pytest Suite with Auth Emulator and FakeLLM
        run: |
          firebase emulators:exec --only auth "pytest -v backend/tests"

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    needs: security-and-brand-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck & Build Bundle
        run: |
          cd frontend
          npm run build

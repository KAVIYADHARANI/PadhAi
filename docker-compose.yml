services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: padhai-postgres
    environment:
      POSTGRES_USER: padhai
      POSTGRES_PASSWORD: padhai
      POSTGRES_DB: padhai
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padhai -d padhai"]
      interval: 5s
      timeout: 5s
      retries: 5

  firebase-emulator:
    image: node:20-alpine
    container_name: padhai-firebase-emulator
    working_dir: /app
    command: >
      sh -c "npm install -g firebase-tools &&
             echo '{\"emulators\":{\"auth\":{\"port\":9099,\"host\":\"0.0.0.0\"}}}' > firebase.json &&
             firebase emulators:start --only auth --project demo-padhai"
    ports:
      - "9099:9099"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padhai-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://padhai:padhai@postgres:5432/padhai
      FIREBASE_PROJECT_ID: demo-padhai
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/storage
      PRODUCT_NAME: PadhAI
      MASCOT_NAME: Parama-AI
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
